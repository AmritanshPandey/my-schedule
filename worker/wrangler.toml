name = "planr-reminders"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# A free *.workers.dev URL for the fetch handler (POST /push/test) — the cron
# trigger below is unaffected; both coexist on the same Worker. Must be
# top-level, not nested under [triggers] — TOML scopes every key after a
# [table] header to that table until the next header.
workers_dev = true

# Free plan includes Cron Triggers down to 1-minute precision.
[triggers]
crons = ["* * * * *"]

# All configuration is stored as encrypted secrets, NOT here. Set them with
# `wrangler secret put <NAME>` (see README.md):
#   FIREBASE_PROJECT_ID     e.g. planr-75429
#   FIREBASE_CLIENT_EMAIL   from the service-account JSON
#   FIREBASE_PRIVATE_KEY    from the service-account JSON (PEM, keep the \n)
#   VAPID_PUBLIC_KEY        from `npx web-push generate-vapid-keys`
#   VAPID_PRIVATE_KEY       from `npx web-push generate-vapid-keys`
#   VAPID_SUBJECT           e.g. mailto:you@example.com
#
# This Worker used to also hold a shared Gemini API key (GEMINI_API_KEY) and
# per-user/global daily-cap vars for a Gemini AI proxy at POST /ai/chat.
# That's gone — AI now runs on a local MLX model the browser talks to
# directly (lib/aiClient.ts), so there's no shared key left to guard here.
